[project]
name = "twokwatcher"
version = "0.1.0"
description = "Watches NBA 2K gameplay over a capture card and turns it into stats."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The native app window. Without it the app falls back to a browser tab.
app = [
    "pywebview>=5.0",
]
# Post-game box score parsing. Gamertags are arbitrary strings, so unlike the
# live scoreboard they need real OCR rather than template matching. Also needs
# the tesseract binary itself (apt install tesseract-ocr / choco install tesseract).
ocr = [
    "pytesseract>=0.3.10",
]
# Installed later, when the tracker work starts.
vision = [
    "ultralytics>=8.3",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
2kw = "twokwatcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twokwatcher = ["hud/glyphs/*.png", "app/static/*", "storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
